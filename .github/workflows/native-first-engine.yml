name: 1.4.2 Native-first compatibility baseline
on:
  push:
    branches:
      - baseline/native-first-142-20261117
      - planning/urce-150-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard-and-candidate:
    name: Original 1.4.1 provenance and 1.4.2 compatibility behavior
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch canonical ancestry and engine branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - name: Verify only the three approved 1.4.2 files differ from 1.4.1
        run: python3 tools/engine_candidate_guard.py
      - name: Parse the complete Bedrock entrypoint without executing it outside BDS
        run: node --check addon/behavior_pack/scripts/main.js
      - name: Execute candidate actual function bodies against native API mocks
        run: node --test implementation/tests/native_first_engine.test.mjs implementation/tests/compatibility_differential_141.test.mjs implementation/tests/active_scan_smoke_141.test.mjs implementation/tests/auto_destination_scan_141.test.mjs implementation/tests/sparse_native_admission_141.test.mjs implementation/tests/native_hopper_compaction_141.test.mjs implementation/tests/transit_first_141.test.mjs implementation/tests/dense_admission_concept_feasibility_141.test.mjs implementation/tests/dense_full_native_admission_141.test.mjs implementation/tests/native_additem_custody_boundary_141.test.mjs
      - name: URCE U1 source-only lazy route differential (planning branch only)
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_lazy_routing_differential_142.test.mjs
      - name: URCE Collector/Receiver capacity-first source research
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_collector_capacity_order_142.test.mjs
      - name: URCE U1 source-only directed graph and candidate policy planner
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_u1_route_model.test.mjs
      - name: URCE U1 source-executed actual 1.4.2 filter and native admission boundary
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_u1_source_gate_differential_142.test.mjs
      - name: URCE U0 exact 1.4.2 writer and callback source census
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_u0_writer_census_142.test.mjs
      - name: URCE U2 fault-closed custody and transaction-density decision model
        if: github.ref_name == 'planning/urce-150-20261117'
        run: node --test planning/tests/urce_u2_custody_protocol.test.mjs
      - name: Confirm original 1.4.1 regression witnesses independently
        shell: bash
        run: |
          set -euo pipefail
          script="addon/behavior_pack/scripts/main.js"
          bp="addon/behavior_pack/manifest.json"
          rp="addon/resource_pack/manifest.json"
          for f in "$script" "$bp" "$rp"; do
            cp "$f" "$RUNNER_TEMP/$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          restore() {
            for f in "$script" "$bp" "$rp"; do
              cp "$RUNNER_TEMP/$(basename "$(dirname "$f")")-$(basename "$f")" "$f"
            done
          }
          trap restore EXIT
          # Original 1.4.1 witnesses must see original 1.4.1 pack versions,
          # not only the old script loaded under a 1.4.2 manifest.
          for f in "$script" "$bp" "$rp"; do
            git show 0ea3000651c116b0fa1acc2836ab7e1bcfbc6269:"$f" > "$f"
          done
          node --test \
            recovery/tests/level2_source_contracts.test.mjs \
            recovery/tests/level2_journal_faults.test.mjs \
            recovery/tests/level2_native_scheduler_screen.test.mjs \
            recovery/tests/level2_native_semantic_gaps.test.mjs \
            recovery/tests/level2_q4_recovery_states.test.mjs \
            recovery/tests/level2_direct_only_guards.test.mjs
      - name: Verify engine candidate remains exactly checked-out, not test-mutated
        shell: bash
        run: |
          git diff --exit-code
          python3 tools/engine_candidate_guard.py

  api-270:
    name: Pinned native @minecraft/server 2.7.0 declarations
    needs: source-guard-and-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
      - name: Obtain exact public 2.7.0 TypeScript definitions in runner scratch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-270"
          name="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @minecraft/server@2.7.0 | tail -n 1)"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/native-270"
          test -s "$RUNNER_TEMP/native-270/package/index.d.ts"
          test -s "$RUNNER_TEMP/native-270/package/package.json"
      - name: Verify precisely versioned native API signatures
        shell: bash
        run: |
          MINECRAFT_SERVER_TYPES_270="$RUNNER_TEMP/native-270/package/index.d.ts" \
          MINECRAFT_SERVER_PACKAGE_270="$RUNNER_TEMP/native-270/package/package.json" \
            node --test recovery/tests/level2_api_270_types.test.mjs implementation/tests/native_display_api_270.test.mjs

  lab-updater-offline:
    name: Guarded Phase A LAB updater safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout pinned candidate source and immutable baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify structural/release hygiene without runtime installation
        run: python scripts/validate_blueprint.py --release-gate
      - name: Parse complete updater and tests before execution
        run: python -m compileall -q scripts/hartlogistics_lab_updater.py tests/test_hartlogistics_lab_updater.py
      - name: Run permanent synthetic LAB updater safety suite
        run: python -m unittest discover -s tests -p test_hartlogistics_lab_updater.py -v
      - name: Confirm offline validation refuses server execution here
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/hartlogistics_lab_updater.py

  candidate-package:
    name: Build non-release Bedrock candidate artifact
    needs: [source-guard-and-candidate, api-270, lab-updater-offline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified source only
        uses: actions/checkout@v4
      - name: Assemble uninstalled BP/RP mcaddon from canonical asset folders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_mcaddon.py \
            --output "dist/HartLogistics_native-first_142_SOURCE_ONLY_UNVERIFIED.mcaddon"
          python3 tools/build_mcaddon.py \
            --output "$RUNNER_TEMP/phase-a-second-build.mcaddon"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile
          p=pathlib.Path("dist/HartLogistics_native-first_142_SOURCE_ONLY_UNVERIFIED.mcaddon")
          q=pathlib.Path(os.environ["RUNNER_TEMP"])/"phase-a-second-build.mcaddon"
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha256(p)==sha256(q), "Same-source builds must be byte-identical"
          print("DETERMINISTIC PHASE A SHA256:",sha256(p))
          with zipfile.ZipFile(p) as outer:
              inner=[n for n in outer.namelist() if n.endswith(".mcpack")]
              assert len(inner)==2
              assert len(outer.testzip() or "")==0
              for name in inner:
                  folder=pathlib.Path("addon")/("behavior_pack" if name.endswith("_BP.mcpack") else "resource_pack")
                  source={
                      p.relative_to(folder).as_posix():p.read_bytes()
                      for p in folder.rglob("*") if p.is_file()
                  }
                  with zipfile.ZipFile(io.BytesIO(outer.read(name))) as pack:
                      assert pack.testzip() is None
                      assert set(pack.namelist())==set(source), f"Pack entries differ: {name}"
                      for member,expected in source.items():
                          assert pack.read(member)==expected, f"Pack bytes differ: {name}/{member}"
                      manifest=json.loads(pack.read("manifest.json"))
                      assert manifest["header"]["version"]==[1,4,2]
                      if name.endswith("_BP.mcpack"):
                          assert pack.read("scripts/main.js")==pathlib.Path("addon/behavior_pack/scripts/main.js").read_bytes()
          print("SOURCE-ONLY CANDIDATE ZIP VALIDATED; NO BDS CLAIM")
          PY
      - name: Retain candidate package for owner-controlled LAB evaluation
        uses: actions/upload-artifact@v4
        with:
          name: HL2-142-native-first-COMPATIBILITY-CANDIDATE-NOT-RELEASED
          path: dist/HartLogistics_native-first_142_SOURCE_ONLY_UNVERIFIED.mcaddon
          retention-days: 14
          if-no-files-found: error
