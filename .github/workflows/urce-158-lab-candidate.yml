name: URCE 1.5.8 isolated hotpath LAB package (NOT terminal fix)
on:
  push:
    branches:
      - dev/urce-158-lab-candidate-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shipped runtime scripts
        run: |
          for file in addon/behavior_pack/scripts/*.js; do node --check "$file"; done
      - name: Run protected writer, full runtime, boundary and resource tests
        run: |
          node --test planning/tests/urce_u0_writer_fence.test.mjs
          node --test runtime/tests/urce_native_api_budget_trace.test.mjs
          node --experimental-vm-modules --test runtime/tests/urce_full_runtime_native_budget.test.mjs
          node --test planning/tests/urce_u1_terminal_composed_graph.test.mjs runtime/tests/urce_158_solid_terminal_probe.test.mjs runtime/tests/urce_158_item_spawn_spatial_gate.test.mjs runtime/tests/urce_150_resource_integrity.test.mjs
      - name: Build isolated 1.5.8 optimization-only package
        run: |
          python3 tools/build_mcaddon.py --output dist/HartLogistics_158_HOTPATH_ONLY_LAB_UNVERIFIED.mcaddon
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          p=pathlib.Path("dist/HartLogistics_158_HOTPATH_ONLY_LAB_UNVERIFIED.mcaddon")
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              packs=[n for n in z.namelist() if n.endswith(".mcpack")]
              assert len(packs)==2
              manifests={}
              for name in packs:
                  with zipfile.ZipFile(io.BytesIO(z.read(name))) as q:
                      assert q.testzip() is None
                      m=json.loads(q.read("manifest.json"))
                      assert m["header"]["version"]==[1,5,8]
                      manifests[name]={"uuid":m["header"]["uuid"],"version":m["header"]["version"]}
                      if "BP" in name:
                          for required in ("scripts/main.js","scripts/urce_152_live_link_guard.js","blocks/transporter.json","blocks/bulk_storage.json"):
                              assert required in q.namelist(), required
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={"status":"SOURCE_CI_ONLY_NOT_BDS_ACCEPTED_NOT_RELEASED","source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"source_branch":os.environ["GITHUB_REF_NAME"],"sha256":h,"size_bytes":p.stat().st_size,"packs":manifests,"scope":"1.5.8 hotpath optimizations ONLY; original terminal HOLD/REJECT retained; no protected Q4 writer changes","deployment":"Disposable or isolated stopped LAB only. No auto-install. No production use."}
          p.with_suffix(".build-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
      - name: Ensure byte-identical repeat build
        run: |
          python3 tools/build_mcaddon.py --output "$RUNNER_TEMP/repeat.mcaddon"
          cmp dist/HartLogistics_158_HOTPATH_ONLY_LAB_UNVERIFIED.mcaddon "$RUNNER_TEMP/repeat.mcaddon"
      - name: Publish candidate only after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: HL-URCE-158-HOTPATH-ONLY-LAB-UNVERIFIED
          path: |
            dist/HartLogistics_158_HOTPATH_ONLY_LAB_UNVERIFIED.mcaddon
            dist/HartLogistics_158_HOTPATH_ONLY_LAB_UNVERIFIED.build-manifest.json
          retention-days: 14
          if-no-files-found: error
