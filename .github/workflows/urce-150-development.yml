name: URCE 1.5 read-only player-facing development candidate

on:
  push:
    branches:
      - dev/urce-150-runtime-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-preview:
    name: Validate U1/U2 source, player-first runtime preview and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate blueprint and non-release source
        run: python3 scripts/validate_blueprint.py --release-gate
      - name: Check all active JavaScript syntax
        run: |
          node --check addon/behavior_pack/scripts/main.js
          node --check addon/behavior_pack/scripts/urce_150_readonly_runtime.js
      - name: Run pure U1/U2 and player-created topology tests
        run: |
          node --test planning/tests/urce_u1_route_model.test.mjs planning/tests/urce_u2_custody_protocol.test.mjs runtime/tests/urce_150_readonly_runtime.test.mjs
      - name: Validate complete BP/RP atlas, textures, geometry and display entity chain
        run: node --test runtime/tests/urce_150_resource_integrity.test.mjs
      - name: Validate client Content Log geometry diagnostic parser
        run: python3 -m unittest discover -s runtime/tests -p test_urce_150_content_log_parser.py -v
      - name: Validate guarded preview LAB updater against disposable worlds
        run: python3 -m unittest discover -s runtime/tests -p test_urce_150_preview_updater.py -v
      - name: Build non-release 1.5 development package
        run: |
          python3 tools/build_mcaddon.py --output dist/HartLogistics_150_READONLY_INFRASTRUCTURE_DEV_UNVERIFIED.mcaddon
          python3 - <<'PY'
          import json,zipfile,io,pathlib
          p=pathlib.Path("dist/HartLogistics_150_READONLY_INFRASTRUCTURE_DEV_UNVERIFIED.mcaddon")
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              packs=[f for f in z.namelist() if f.endswith(".mcpack")]
              assert len(packs)==2
              for f in packs:
                  with zipfile.ZipFile(io.BytesIO(z.read(f))) as pack:
                      assert pack.testzip() is None
                      m=json.loads(pack.read("manifest.json"))
                      assert m["header"]["version"]==[1,5,0]
                      if "BP" in f:
                          assert "blocks/transporter.json" in pack.namelist()
                          assert "blocks/bulk_storage.json" in pack.namelist()
                          assert "scripts/urce_150_readonly_runtime.js" in pack.namelist()
                      else:
                          assert "textures/blocks/hartlogistics_transporter.png" in pack.namelist()
                          assert "textures/blocks/hartlogistics_bulk_storage.png" in pack.namelist()
                          # A resource-model reference existing in source says
                          # nothing about what the game client registered;
                          # nevertheless catch omissions from nested package.
                          model_paths = (
                              "models/blocks/sorter_frame_mask.geo.json",
                              "models/blocks/hartlogistics_transporter.geo.json",
                              "models/blocks/hartlogistics_bulk_storage.geo.json",
                          )
                          identifiers = set()
                          for model_path in model_paths:
                              assert model_path in pack.namelist(), f"Packaged RP geometry omitted: {model_path}"
                              geometry=json.loads(pack.read(model_path))
                              identifiers.update(m["description"]["identifier"]
                                  for m in geometry["minecraft:geometry"])
                          expected = {
                              *(f"geometry.hartlogistics.sorter_mask_{d}"
                                for d in ("north", "south", "east", "west")),
                              "geometry.hartlogistics.transporter",
                              "geometry.hartlogistics.bulk_storage",
                          }
                          assert expected <= identifiers, "Incomplete packaged geometry identifiers"
          print("1.5 SOURCE-ONLY DEVELOPMENT PREVIEW PACK VALIDATED; NO BDS PASS")
          PY
      - name: Verify deterministic package and publish exact source/checksums
        run: |
          python3 tools/build_mcaddon.py --output "$RUNNER_TEMP/urce-repeat-build.mcaddon"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          package=pathlib.Path("dist/HartLogistics_150_READONLY_INFRASTRUCTURE_DEV_UNVERIFIED.mcaddon")
          repeat=pathlib.Path(os.environ["RUNNER_TEMP"])/"urce-repeat-build.mcaddon"
          def digest(data): return hashlib.sha256(data).hexdigest()
          current=package.read_bytes()
          assert digest(current)==digest(repeat.read_bytes()),"Non-deterministic same-source package!"
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert sha==os.environ["GITHUB_SHA"],"Checkout/run identity mismatch"
          with zipfile.ZipFile(io.BytesIO(current)) as bundle:
              packs={}
              for name in sorted(bundle.namelist()):
                  if not name.endswith(".mcpack"): continue
                  payload=bundle.read(name)
                  with zipfile.ZipFile(io.BytesIO(payload)) as contents:
                      manifest=json.loads(contents.read("manifest.json"))
                  packs[name]={"sha256":digest(payload),"size_bytes":len(payload),
                              "uuid":manifest["header"]["uuid"],
                              "version":manifest["header"]["version"]}
              assert len(packs)==2
          record={
              "status":"SOURCE_ONLY_CI_NOT_BDS_TESTED_NOT_RELEASED",
              "source_commit":sha,
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "source_branch":os.environ["GITHUB_REF_NAME"],
              "artifact_name":package.name,
              "artifact_sha256":digest(current),
              "artifact_bytes":len(current),
              "packs":packs,
              "supported_testing":"Copied LAB only; explicit apply required; no production or release"
          }
          output=package.with_suffix(".build-manifest.json")
          output.write_text(json.dumps(record,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("Exact URCE preview artifact SHA-256:",record["artifact_sha256"])
          print("Build source:",sha)
          PY
      - name: Retain owner-playable infrastructure preview (not accepted URCE)
        uses: actions/upload-artifact@v4
        with:
          name: HL-URCE-150-READONLY-INFRASTRUCTURE-DEV-NOT-RELEASED
          path: |
            dist/HartLogistics_150_READONLY_INFRASTRUCTURE_DEV_UNVERIFIED.mcaddon
            dist/HartLogistics_150_READONLY_INFRASTRUCTURE_DEV_UNVERIFIED.build-manifest.json
            distribution/Start-HartLogistics-150Lab.ps1
            distribution/URCE150_PLAYER_LAB_TEST_CARD.md
            distribution/Diagnose-HartLogistics-LABResources.ps1
          retention-days: 14
          if-no-files-found: error


  windows-operator-handoff:
    name: Prove PowerShell-first LAB launcher and synthetic rollback on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse the actual PowerShell launcher and fail-closed operator modes
        shell: pwsh
        run: |
          $file = (Resolve-Path 'distribution/Start-HartLogistics-150Lab.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ('PowerShell syntax: '+($errors | Out-String)) }
          $refusals = @(
              @{ Mode='Install' },
              @{ Mode='Rollback' },
              @{ Mode='CheckLab' },
              @{ Mode='Plan'; Apply=$true }
          )
          foreach ($args in $refusals) {
              $refused = $false
              try { & $file @args | Out-Null }
              catch {
                  if ($_.Exception.Message -notmatch 'REFUSED URCE 1.5 LAB preview') { throw }
                  $refused = $true
              }
              if (-not $refused) { throw ('Unsafe launch mode was not refused: '+$args.Mode) }
          }
          Write-Output 'PowerShell syntax and early no-LAB refusal checks PASS'
      - name: Parse read-only LAB resource doctor without opening a server
        shell: pwsh
        run: |
          $file = (Resolve-Path 'distribution/Diagnose-HartLogistics-LABResources.ps1').Path
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ('Resource diagnostic PowerShell syntax: '+($errors | Out-String)) }
          & $file -SourceOnly
          if ($LASTEXITCODE -ne 0) { throw 'Read-only resource doctor source mode failed' }
      - name: Exercise resource doctor on disposable Windows LAB and missing PNG
        shell: pwsh
        run: |
          $lab = 'C:\Servers\Thomas_MCBedrock - Copy (2)'
          if (Test-Path -LiteralPath $lab) { throw 'Refuse pre-existing Windows test LAB fixture' }
          try {
              New-Item -ItemType Directory -Path $lab -Force | Out-Null
              New-Item -ItemType Directory -Path (Join-Path $lab 'behavior_packs') -Force | Out-Null
              New-Item -ItemType Directory -Path (Join-Path $lab 'resource_packs') -Force | Out-Null
              New-Item -ItemType Directory -Path (Join-Path $lab 'worlds\ThomasServer') -Force | Out-Null
              Copy-Item -LiteralPath 'addon\behavior_pack' -Destination (Join-Path $lab 'behavior_packs\HartMods_HartLogistics_BP') -Recurse
              Copy-Item -LiteralPath 'addon\resource_pack' -Destination (Join-Path $lab 'resource_packs\HartMods_HartLogistics_RP') -Recurse
              Set-Content -LiteralPath (Join-Path $lab 'server.properties') -Value @(
                  'level-name=ThomasServer'
                  'texturepack-required=true'
                  'content-log-file-enabled=true'
              )
              # Owner-format JSONC with multiple independently registered packs,
              # inline // annotations, block comments, quoted URLs, escaped
              # quotation marks, and optional trailing commas. No writes by doctor.
              $registration = @'
          [
              { //XpVault
                  "pack_id":"71326c42-6c3c-49e4-99e4-6f6e4d64c2f9",
                  "version":[2,0,2],
                  "support_url":"https://example.org/path//valid?name=\"test\""
              },
              { //HartLogistics
                  "pack_id":"91316442-0f26-4fbb-88f3-2e39ea843a1a",
                  "version":[1,5,0,],
              },
              { /* HartBots registered resource pack */
                  "pack_id":"316ea1b2-fc60-48e4-afc8-6816b02a5406",
                  "version":[1,7,13]
              }
          ]
          '@
              $registrationPath = Join-Path $lab 'worlds\ThomasServer\world_resource_packs.json'
              Set-Content -LiteralPath $registrationPath -Value $registration
              $hashBefore=(Get-FileHash -LiteralPath $registrationPath -Algorithm SHA256).Hash
              & .\distribution\Diagnose-HartLogistics-LABResources.ps1
              if ($LASTEXITCODE -ne 0) { throw 'Commented multi-pack JSONC should PASS synthetic LAB resource scan' }
              if ((Get-FileHash -LiteralPath $registrationPath -Algorithm SHA256).Hash -ne $hashBefore) {
                  throw 'Read-only resource doctor modified the original JSONC registration!'
              }
              $texture = Join-Path $lab 'resource_packs\HartMods_HartLogistics_RP\textures\blocks\hartlogistics_transporter.png'
              Remove-Item -LiteralPath $texture -Force
              & .\distribution\Diagnose-HartLogistics-LABResources.ps1
              if ($LASTEXITCODE -ne 2) { throw 'Missing PNG must fail-closed with exit 2' }
              if ((Get-FileHash -LiteralPath $registrationPath -Algorithm SHA256).Hash -ne $hashBefore) {
                  throw 'Diagnostic modified unrelated JSONC registration during missing-asset refusal!'
              }
              Write-Output 'JSONC multi-pack read-only diagnostic PASS and missing-PNG refusal PASS on disposable runner'
          } finally {
              if (Test-Path -LiteralPath $lab) { Remove-Item -LiteralPath $lab -Force -Recurse }
          }
          # The deliberate refusal under test must not poison the wrapper's
          # final native-command exit status after both assertions succeeded.
          exit 0
      - name: Run source-only one-file PowerShell Plan through its Git/Python handoff
        shell: pwsh
        run: |
          & .\distribution\Start-HartLogistics-150Lab.ps1 -Mode Plan -ExpectedCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell Plan returned nonzero' }
      - name: Run disposable on-Windows 1.4.2 to 1.5 update/rollback suite
        shell: pwsh
        run: python -m unittest discover -s runtime/tests -p test_urce_150_preview_updater.py -v
