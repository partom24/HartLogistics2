name: URCE 1.5.13 bounded governed two-bank Transporter Filter home + original Q4 custody
on:
  push:
    branches:
      - dev/urce-1513-governed-bank-filter-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zero new custody writer and native script syntax
        run: |
          for file in addon/behavior_pack/scripts/*.js; do node --check "$file"; done
          node --test planning/tests/urce_u0_writer_fence.test.mjs
          python scripts/check_project_continuity.py
      - name: Execute actual direct native Sorter source/proof model
        run: node --experimental-vm-modules --test runtime/tests/urce_159_direct_sorter_home.test.mjs
      - name: Source-executed one/two-bank Filter home and negative path checks
        run: node --experimental-vm-modules --test runtime/tests/urce_1513_verified_bank_filter.test.mjs runtime/tests/urce_1513_thirteen_bank_chain.test.mjs
      - name: Repeat immutable 101 column 5 item delivery comparison
        run: node --experimental-vm-modules --test runtime/tests/urce_101_five_item_stage_gate.test.mjs
      - name: Execute U1 graph/claim, custody protocol and verified native paths
        run: |
          node --experimental-vm-modules --test runtime/tests/urce_u1a_column_local_decisions.test.mjs runtime/tests/urce_u1b_destination_side_effect_parity.test.mjs runtime/tests/urce_u1cd_shadow_contract.test.mjs runtime/tests/urce_u1e_same_tick_shadow_evidence.test.mjs runtime/tests/urce_u1e_multibank_graph_parity.test.mjs runtime/tests/urce_u1f_claim_coverage.test.mjs
          node --test planning/tests/urce_u2_custody_protocol.test.mjs planning/tests/urce_u1_owner_loop.test.mjs planning/tests/urce_u1_owner_bank_chain.test.mjs planning/tests/urce_u1_terminal_composed_graph.test.mjs runtime/tests/urce_152_link_guard.test.mjs runtime/tests/urce_152_live_wiring.test.mjs runtime/tests/urce_155_journal_idle.test.mjs
      - name: Full shipped-runtime stub and Q4/physical budget regression
        run: |
          node --test runtime/tests/urce_native_api_budget_trace.test.mjs
          node --experimental-vm-modules --test runtime/tests/urce_full_runtime_native_budget.test.mjs
          node --test runtime/tests/urce_158_solid_terminal_probe.test.mjs runtime/tests/urce_157_native_boundary_diagnostic.test.mjs
      - name: Verify blueprint and all active assets
        run: |
          python3 scripts/validate_blueprint.py --release-gate
          node --test runtime/tests/urce_150_resource_integrity.test.mjs
      - name: Verify exact owner-installed 1.5.11 predecessor upgrade and rollback
        run: python3 -m unittest discover -s runtime/tests -p test_urce_1513_bank_filter_lab_updater.py -v
      - name: Deterministic 1.5.13 full integrated BP/RP source candidate
        run: |
          python3 tools/build_mcaddon.py --output dist/HartLogistics_1513_INERT_NATIVE_END_LAB_NOT_BDS_ACCEPTED.mcaddon
          python3 tools/build_mcaddon.py --output "$RUNNER_TEMP/repeat.mcaddon"
          cmp dist/HartLogistics_1513_INERT_NATIVE_END_LAB_NOT_BDS_ACCEPTED.mcaddon "$RUNNER_TEMP/repeat.mcaddon"
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,zipfile
          p=pathlib.Path("dist/HartLogistics_1513_INERT_NATIVE_END_LAB_NOT_BDS_ACCEPTED.mcaddon")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              packs=[x for x in z.namelist() if x.endswith(".mcpack")]
              assert len(packs)==2
              ids=[]
              for filename in packs:
                  with zipfile.ZipFile(io.BytesIO(z.read(filename))) as pack:
                      assert pack.testzip() is None
                      manifest=json.loads(pack.read("manifest.json"))
                      assert manifest["header"]["version"]==[1,5,13]
                      ids.append(manifest["header"]["uuid"])
                      if "scripts/main.js" in pack.namelist():
                          assert "scripts/urce_159_direct_sorter_home.js" in pack.namelist()
                          assert "scripts/urce_152_live_link_guard.js" in pack.namelist()
          result={"source_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "status":"SOURCE_AND_SYNTHETIC_ONLY_NO_BDS_ACCEPTANCE",
                  "pack_uuids":ids,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "scope":"Exact native stone/vanilla inert Hopper stopper and terminal chest, with Filter/Auto/Wildcard home via original Q4 single writer; multi-bank HOLD",
                  "installation":"Copied LAB stopped CheckLab + explicit owner Apply only; never production"}
          assert result["source_sha"]==os.environ["GITHUB_SHA"]
          p.with_suffix(".build-manifest.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - name: Retain nonrelease 1.5.13 candidate only if all source gates pass
        uses: actions/upload-artifact@v4
        with:
          name: HL-URCE-1513-INERT-NATIVE-END-LAB-NOT-BDS-ACCEPTED
          path: |
            dist/HartLogistics_1513_INERT_NATIVE_END_LAB_NOT_BDS_ACCEPTED.mcaddon
            dist/HartLogistics_1513_INERT_NATIVE_END_LAB_NOT_BDS_ACCEPTED.build-manifest.json
          retention-days: 14
          if-no-files-found: error
  windows-operator:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression - Git clone progress on stderr under Windows PowerShell 5.1 Stop
        shell: powershell
        run: |
          & .\\distribution\\tests\\Test-HartLogisticsNativeGit.ps1
      - name: Regression - native Git behavior under PowerShell 7 Stop
        shell: pwsh
        run: |
          & .\\distribution\\tests\\Test-HartLogisticsNativeGit.ps1
      - name: Validate stable and 1.5.13 PowerShell source and early refusal
        shell: pwsh
        run: |
          foreach ($file in @('distribution/Start-HartLogistics-Lab.ps1',
                              'distribution/Start-HartLogistics-1513Lab.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ('Invalid PowerShell: '+$file+' '+($errors|Out-String)) }
            $refused=$false
            try { & (Resolve-Path $file).Path -Mode Install -ErrorAction Stop | Out-Null }
            catch {
              if ($_.Exception.Message -notmatch 'REFUSED') { throw }
              $refused=$true
            }
            if (-not $refused) { throw ('Missing mandatory -Apply refusal: '+$file) }
          }
      - name: Synthetic exact 1.5.11 predecessor to 1.5.13 BP/RP upgrade, interrupted recovery and rollback
        shell: pwsh
        run: python -m unittest discover -s runtime/tests -p test_urce_1513_bank_filter_lab_updater.py -v
