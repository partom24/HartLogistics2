name: URCE 1.4.1 native Hopper and chest parity — source checks only
on:
  push:
    branches:
      - dev/urce-159-141-parity-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-and-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate shipping JS syntax
        run: |
          for file in addon/behavior_pack/scripts/*.js; do node --check "$file"; done
      - name: 1.4.1 Hopper direction, chest and no-second-writer parity
        run: node --experimental-vm-modules --test runtime/tests/urce_159_legacy_native_terminal_parity.test.mjs
      - name: Preserve 1.5.9 direct Sorter and old 101-column routing
        run: |
          node --experimental-vm-modules --test runtime/tests/urce_159_direct_sorter_home.test.mjs
          node --experimental-vm-modules --test runtime/tests/urce_101_five_item_stage_gate.test.mjs
      - name: Q4 native custody and baseline writer safety
        run: |
          node --experimental-vm-modules --test runtime/tests/urce_full_runtime_native_budget.test.mjs
          node --test planning/tests/urce_u0_writer_fence.test.mjs
      - name: Project canonical resource continuity
        run: |
          python3 scripts/validate_blueprint.py --release-gate
      - name: Report proof boundary
        run: |
          echo "Source parity and synthetic custody fixture only — NO BDS acceptance."
          echo "No 1.5.9 operator/package is generated; strict updater source pins MUST be re-reviewed."
