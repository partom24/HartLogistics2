name: URCE 1.5.9 governed direct native home source/custody proof
on:
  push:
    branches:
      - dev/urce-159-governed-home-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zero new custody writer and native script syntax
        run: |
          for file in addon/behavior_pack/scripts/*.js; do node --check "$file"; done
          node --test planning/tests/urce_u0_writer_fence.test.mjs
          python scripts/check_project_continuity.py
      - name: Execute actual direct native Sorter source/proof model
        run: node --experimental-vm-modules --test runtime/tests/urce_159_direct_sorter_home.test.mjs
      - name: Repeat immutable 101 column 5 item delivery comparison
        run: node --experimental-vm-modules --test runtime/tests/urce_101_five_item_stage_gate.test.mjs
      - name: Execute U1 graph/claim, custody protocol and verified native paths
        run: |
          node --experimental-vm-modules --test runtime/tests/urce_u1a_column_local_decisions.test.mjs runtime/tests/urce_u1b_destination_side_effect_parity.test.mjs runtime/tests/urce_u1cd_shadow_contract.test.mjs runtime/tests/urce_u1e_same_tick_shadow_evidence.test.mjs runtime/tests/urce_u1e_multibank_graph_parity.test.mjs runtime/tests/urce_u1f_claim_coverage.test.mjs
          node --test planning/tests/urce_u2_custody_protocol.test.mjs planning/tests/urce_u1_owner_loop.test.mjs planning/tests/urce_u1_owner_bank_chain.test.mjs planning/tests/urce_u1_terminal_composed_graph.test.mjs runtime/tests/urce_152_link_guard.test.mjs runtime/tests/urce_152_live_wiring.test.mjs runtime/tests/urce_155_journal_idle.test.mjs
      - name: Full shipped-runtime stub and Q4/physical budget regression
        run: |
          node --test runtime/tests/urce_native_api_budget_trace.test.mjs
          node --experimental-vm-modules --test runtime/tests/urce_full_runtime_native_budget.test.mjs
          node --test runtime/tests/urce_158_solid_terminal_probe.test.mjs runtime/tests/urce_157_native_boundary_diagnostic.test.mjs
      - name: Verify blueprint and all active assets
        run: |
          python3 scripts/validate_blueprint.py --release-gate
          node --test runtime/tests/urce_150_resource_integrity.test.mjs
