name: Blueprint compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate declared project structure
        run: python scripts/validate_blueprint.py
      - name: Run blueprint validator self-tests only
        run: python tests/test_validate_blueprint.py -v
      - name: Run HartLogistics LAB updater offline safety tests
        run: python -m unittest discover -s tests -p 'test_hartlogistics_lab_updater.py' -v
      - name: Check legacy MR preservation and proposed ordinary network fail-closed invariants
        run: python -m unittest discover -s tests -p 'test_legacy_mr_offline_invariants.py' -v
      - name: Verify offline six-face Transporter graph connectivity proposal
        run: python -m unittest discover -s tests -p 'test_transport_topology_model.py' -v
      - name: Check proposed Transporter region authority fails closed on splits, unloads and competing controllers
        run: python -m unittest discover -s tests -p 'test_transport_authority_model.py' -v
      - name: Exercise standalone ordinary Transporter/Bulk pure-JavaScript core
        run: |
          node --check candidates/transport/ordinary_network_core.mjs
          node --test tests/test_transport_bulk_core.mjs
      - name: Fault-inject standalone ordinary transfer append-only journal on ephemeral runner
        run: |
          node --check candidates/transport/ordinary_journal.node.mjs
          node --test tests/test_transport_journal.node.mjs
      - name: Offline Bundle 2 placed-block, q4 to q5 and menu safety models
        run: python -m unittest discover -s tests -p 'test_bundle2_offline_safety.py' -v
      - name: Verify PG08 menu candidate offline build source gates
        run: python -m unittest discover -s tests -p 'test_pg08_candidate_build.py' -v
      - name: Simulate PG08 LAB 1.5.0 multi-pack install and rollback
        run: python -m unittest discover -s tests -p 'test_pg08_lab_deploy.py' -v
      - name: Exercise actual PG08 menu candidate with Node mocks
        run: |
          node --check candidates/pg08/menu_overlay.js
          node tests/test_pg08_menu_mock.cjs
      - name: Compile isolated PG08 candidate and check JavaScript syntax
        run: |
          python candidates/pg08/prepare_candidate.py
          node --check --input-type=module < build/pg08-lab/behavior_pack/scripts/main.js


  pg08-python312-launcher-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up LAB-host-compatible Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise real PG08 Plan launcher with Python 3.12 in disposable Git fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Entire checkout and script run are under a disposable GitHub runner,
          # never a real Minecraft server. Plan mode does not inspect LAB.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'pg08-launcher-fixture'
          [void](New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force)
          $workspace = Join-Path $env:LOCALAPPDATA 'HartLogistics2-PG08-LAB'
          & git.exe clone --quiet . $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture clone failed' }
          & git.exe -C $workspace checkout -B main
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture main checkout failed' }
          & git.exe -C $workspace remote set-url origin https://github.com/partom24/HartLogistics2.git
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture origin setup failed' }
          $output = & '.\\candidates\\pg08\\Start-HartLogistics-PG08Lab.ps1' -Mode Plan | Out-String
          if (-not $output.Contains('Using Python 3.12')) { throw 'Launcher did not select existing Python 3.12' }
          if ($output -notmatch 'PG08 SOURCE PASS') { throw 'Source-only Plan failed' }
          if ($output -notmatch 'No LAB/PROD files accessed') { throw 'Missing no-server-access evidence' }
          Write-Host $output
          Write-Host 'PG08 Python 3.12 launcher PLAN PASS on Windows ephemeral runner'

  bundle2-readonly-preflight-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python for synthetic PG08 deployment checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify PG08 LAB replacement safety on Windows fixture
        run: python -m unittest discover -s tests -p 'test_pg08_lab_deploy.py' -v
      - name: PG08 PowerShell launcher parses and refuses dangerous argument combinations
        shell: powershell
        run: |
          $launcher = '.\\candidates\\pg08\\Start-HartLogistics-PG08Lab.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $launcher).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ('PG08 PowerShell syntax errors: ' + ($errors | Out-String)) }
          foreach ($argsSet in @(
            @('-Mode','Install'),
            @('-Mode','Rollback','-Apply'),
            @('-Mode','CheckLab','-Apply'),
            @('-Mode','Plan','-Apply')
          )) {
            $rejected = $false
            try { & $launcher @argsSet | Out-Null } catch { $rejected = $true }
            if (-not $rejected) { throw ('PG08 launcher failed to refuse: ' + ($argsSet -join ' ')) }
          }
          Write-Host 'PG08 PowerShell launcher syntax and fail-closed entry checks PASS'
      - name: Syntax and allowlist checks
        shell: powershell
        run: |
          $s = '.\scripts\diagnostics\Read-HartLogistics-Bundle2Lab.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $t = Get-Content -LiteralPath $s -Raw
          if (-not $t.Contains('C:\Servers\Thomas_MCBedrock - Copy (2)')) { throw 'Missing LAB allowlist' }
          if ($t -match '(?m)^\s*(Set-Content|Remove-Item|Copy-Item|Move-Item|New-Item|Out-File|Invoke-WebRequest)\b') { throw 'Writes found' }
      - name: Synthetic fixture (GitHub-hosted ephemeral runner only)
        shell: powershell
        run: |
          $lab = 'C:\Servers\Thomas_MCBedrock - Copy (2)'
          if (Test-Path -LiteralPath $lab) { throw 'Unexpected runner LAB path already exists' }
          try {
            [void](New-Item -ItemType Directory -Path (Join-Path $lab 'worlds\ThomasServer') -Force)
            [void](New-Item -ItemType Directory -Path (Join-Path $lab 'behavior_packs\HartBP') -Force)
            [void](New-Item -ItemType Directory -Path (Join-Path $lab 'resource_packs\HartRP') -Force)
            [IO.File]::WriteAllText((Join-Path $lab 'server.properties'), 'level-name=ThomasServer')
            [IO.File]::WriteAllText((Join-Path $lab 'behavior_packs\HartBP\manifest.json'), '{"header":{"uuid":"4854d263-05dd-4f79-a21c-7ba969295c2d","version":[1,4,1]}}')
            [IO.File]::WriteAllText((Join-Path $lab 'resource_packs\HartRP\manifest.json'), '{"header":{"uuid":"91316442-0f26-4fbb-88f3-2e39ea843a1a","version":[1,4,1]}}')
            # Realistic multi-entry JSONC with comments and a non-Hart pack.
            $bpJson = '[ // HartBots / Hart Logistics example' + [Environment]::NewLine + '{"pack_id":"20dbb8a2-cce7-48d7-8263-b65d160a785f","version":[1,7,3]},' + [Environment]::NewLine + '{"pack_id":"4854d263-05dd-4f79-a21c-7ba969295c2d","version":[1,5,0],},' + [Environment]::NewLine + ']'
            [IO.File]::WriteAllText((Join-Path $lab 'worlds\ThomasServer\world_behavior_packs.json'), $bpJson)
            [IO.File]::WriteAllText((Join-Path $lab 'worlds\ThomasServer\world_resource_packs.json'), '[{"pack_id":"71326c42-6c3c-49e4-99e4-6f6e4d64c2f9","version":[2,0,2]}, // XP Vault' + [Environment]::NewLine + '{"pack_id":"91316442-0f26-4fbb-88f3-2e39ea843a1a","version":[1,5,0]}]')
            $paths = @('server.properties','behavior_packs\HartBP\manifest.json','resource_packs\HartRP\manifest.json','worlds\ThomasServer\world_behavior_packs.json','worlds\ThomasServer\world_resource_packs.json')
            $before = @{}
            foreach ($p in $paths) { $f=Join-Path $lab $p; $before[$f]=(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash }
            $result = & '.\scripts\diagnostics\Read-HartLogistics-Bundle2Lab.ps1' | Out-String
            Write-Host $result
            if ($result -notmatch 'Hart BP registry: 1 match\(es\), versions 1\.5\.0') { throw 'BP multi-entry JSONC parse failed' }
            if ($result -notmatch 'Hart RP registry: 1 match\(es\), versions 1\.5\.0') { throw 'RP multi-entry JSONC parse failed' }
            if ($result -notmatch 'Retired PG03 probe registered: False') { throw 'False-positive probe' }
            foreach ($p in $paths) { $f=Join-Path $lab $p; if ((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash -ne $before[$f]) { throw "Diagnostic mutated fixture $p" } }
            Write-Host 'Read-only synthetic PASS'
          } finally {
            if (Test-Path -LiteralPath $lab) { Remove-Item -LiteralPath $lab -Force -Recurse }
          }
