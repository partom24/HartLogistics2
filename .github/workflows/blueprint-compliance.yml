name: Blueprint compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate declared project structure
        run: python scripts/validate_blueprint.py
      - name: Run blueprint validator self-tests only
        run: python tests/test_validate_blueprint.py -v
      - name: Run HartLogistics LAB updater offline safety tests
        run: python -m unittest discover -s tests -p 'test_hartlogistics_lab_updater.py' -v
      - name: Check legacy MR preservation and proposed ordinary network fail-closed invariants
        run: python -m unittest discover -s tests -p 'test_legacy_mr_offline_invariants.py' -v
      - name: Source-execute 1.4.1 native-item recovery fault windows without changing gameplay
        run: |
          node --check tests/test_legacy_mr_recovery_faults.mjs
          node --test tests/test_legacy_mr_recovery_faults.mjs
      - name: Verify offline six-face Transporter graph connectivity proposal
        run: python -m unittest discover -s tests -p 'test_transport_topology_model.py' -v
      - name: Check proposed Transporter region authority fails closed on splits, unloads and competing controllers
        run: python -m unittest discover -s tests -p 'test_transport_authority_model.py' -v
      - name: Exercise offline-only PG18 region repartition and held predecessor fences
        run: |
          node --check candidates/transport/region_repartition_proposal.mjs
          node --test tests/test_transport_repartition_proposal.mjs
      - name: Exercise standalone ordinary Transporter/Bulk pure-JavaScript core
        run: |
          node --check candidates/transport/ordinary_network_core.mjs
          node --test tests/test_transport_bulk_core.mjs
      - name: Q5 ordinary bucket pages and destination-aware selection (offline only)
        run: |
          node --check candidates/transport/q5_bucket_core.mjs
          node --check tests/test_q5_bucket_core.mjs
          node --test tests/test_q5_bucket_core.mjs
      - name: Q5 offline shadow staging and mixed-save fault matrix
        run: |
          node --check candidates/transport/q5_shadow_staging.mjs
          node --check tests/test_q5_shadow_staging.mjs
          node --test tests/test_q5_shadow_staging.mjs
      - name: Q5 offline read-only decoder of actual Q4 page/definition schema
        run: |
          node --check candidates/transport/q5_q4_readonly_snapshot.mjs
          node --check tests/test_q5_q4_readonly_snapshot.mjs
          node --test tests/test_q5_q4_readonly_snapshot.mjs
      - name: Q5 source-shaped read-only Q4 property scans and drift faults
        run: |
          node --check candidates/transport/q5_q4_read_adapter.mjs
          node --check tests/test_q5_q4_read_adapter.mjs
          node --test tests/test_q5_q4_read_adapter.mjs
      - name: Q5 complete Q4 read-only preview and classification refusal tests
        run: |
          node --check candidates/transport/q5_readonly_preview.mjs
          node --check tests/test_q5_readonly_preview.mjs
          node --test tests/test_q5_readonly_preview.mjs
      - name: Q5 world-wide maintenance epoch and unloaded-block refusal model (offline)
        run: |
          node --check candidates/transport/q5_maintenance_epoch.mjs
          node --check tests/test_q5_maintenance_epoch.mjs
          node --test tests/test_q5_maintenance_epoch.mjs
      - name: Q5 PG27 source-level global freeze writer and callback seam census
        run: |
          python -m unittest discover -s tests -p 'test_q5_pg27_guard_audit.py' -v
          python candidates/transport/q5_pg27_guard_audit.py
      - name: Q5 dual-record world maintenance control reader and torn-write refusals (offline)
        run: |
          node --check candidates/transport/q5_world_guard_read.mjs
          node --check tests/test_q5_world_guard_read.mjs
          node --test tests/test_q5_world_guard_read.mjs
      - name: Q5 Q4 ordinary serialized shape and metadata-rich refusal gate (offline)
        run: |
          node --check candidates/transport/q5_ordinary_shape_gate.mjs
          node --check tests/test_q5_ordinary_shape_gate.mjs
          node --test tests/test_q5_ordinary_shape_gate.mjs
          node --test tests/test_q5_readonly_preview.mjs
      - name: Q5 non-deployable PG27 guard weaving and source mutation checks
        run: |
          python -m unittest discover -s tests -p 'test_q5_guard_weave_preview.py' -v
      - name: Q5 anonymous event and deferred callback guard weaving (uninstallable)
        run: |
          python -m unittest discover -s tests -p 'test_q5_callback_guard_preview.py' -v
      - name: Q5 single-use legacy precommit marker fence and restart fault matrix
        run: |
          node --check candidates/transport/q5_legacy_precommit_fence.mjs
          node --check tests/test_q5_legacy_precommit_fence.mjs
          node --test tests/test_q5_legacy_precommit_fence.mjs
      - name: Q5 source-shaped before/after/deferred event policy and vanilla isolation
        run: |
          node --check candidates/transport/q5_event_boundary_policy.mjs
          node --check tests/test_q5_event_boundary_policy.mjs
          node --test tests/test_q5_event_boundary_policy.mjs
      - name: Q5 non-throwing event-to-native precommit composition (offline only)
        run: |
          node --check candidates/transport/q5_nonthrowing_boundary_preview.mjs
          node --check tests/test_q5_nonthrowing_boundary_preview.mjs
          node --test tests/test_q5_nonthrowing_boundary_preview.mjs
      - name: Q5 world-wide read-only Receiver Q4 census and drift tests
        run: |
          node --check candidates/transport/q5_world_receiver_census.mjs
          node --check tests/test_q5_world_receiver_census.mjs
          node --test tests/test_q5_world_receiver_census.mjs
      - name: Q5 global Q4 census to conservative ordinary bucket draft preview
        run: |
          node --check candidates/transport/q5_world_ordinary_preview.mjs
          node --check tests/test_q5_world_ordinary_preview.mjs
          node --test tests/test_q5_world_ordinary_preview.mjs
      - name: UCE shared Receiver and Bulk account cold-Q4 ingestion and conservation (source only)
        run: |
          node --check candidates/transport/unified_ordinary_accounts.mjs
          node --check tests/test_unified_ordinary_accounts.mjs
          node --test tests/test_unified_ordinary_accounts.mjs
      - name: UCE one-property world shard writer, ambiguous-save quarantine and restart cuts
        run: |
          node --check candidates/transport/unified_world_shard_writer.mjs
          node --check tests/test_unified_world_shard_writer.mjs
          node --test tests/test_unified_world_shard_writer.mjs
      - name: UCE native whole ItemStack port — ACK, ambiguity and restart refusal
        run: |
          node --check candidates/transport/unified_native_custody.mjs
          node --check tests/test_unified_native_custody.mjs
          node --test tests/test_unified_native_custody.mjs
      - name: UCE persistent native carrier host, no-respawn and nonexperimental entity asset
        run: |
          node --check candidates/transport/unified_carrier_registry.mjs
          node --check tests/test_unified_carrier_registry.mjs
          node --test tests/test_unified_carrier_registry.mjs
      - name: Build unified Bedrock candidate from PG33 and assert old writers frozen under UCE
        run: |
          python -m unittest discover -s tests -p 'test_uce_candidate_build.py' -v
          python candidates/uce/prepare_candidate.py
          node --check --input-type=module < build/uce-integrated/behavior_pack/scripts/main.js
      - name: UCE cold Q4 import with immutable 1.4.1 source, MR holds and torn-stage recovery
        run: |
          node --check candidates/transport/unified_cold_q4_importer.mjs
          node --check tests/test_unified_cold_q4_importer.mjs
          node --test tests/test_unified_cold_q4_importer.mjs
      - name: UCE ordinary physical escrow native receipt to ledger account to native ACK
        run: |
          node --check tests/test_unified_ordinary_escrow.mjs
          node --test tests/test_unified_ordinary_escrow.mjs
      - name: UCE exact Bedrock ejected item handler ticket and native carrier integration
        run: |
          node --check tests/test_uce_ejected_runtime_mock.mjs
          node --test tests/test_uce_ejected_runtime_mock.mjs
      - name: UCE native item entity from vanilla ejection through shared custody journal
        run: |
          node --check tests/test_uce_ejected_native_port.mjs
          node --test tests/test_uce_ejected_native_port.mjs
      - name: UCE direct Sorter executor with real native journal and interrupted move
        run: |
          node --check tests/test_uce_sorter_direct_real_port.mjs
          node --test tests/test_uce_sorter_direct_real_port.mjs
      - name: UCE original direct Sorter native storage executor uses the same journal
        run: |
          node --check tests/test_uce_sorter_direct_mock.mjs
          node --test tests/test_uce_sorter_direct_mock.mjs
      - name: UCE read-only legacy Sorter to Collector winner selection and source ownership
        run: |
          node --check tests/test_uce_sorter_collector_route_mock.mjs
          node --test tests/test_uce_sorter_collector_route_mock.mjs
      - name: UCE single-writer Transporter and Sorter route graph, priority and revalidation
        run: |
          node --check candidates/uce/runtime_pipe_route.js
          node --check tests/test_uce_pipe_route_mock.mjs
          node --test tests/test_uce_pipe_route_mock.mjs
      - name: UCE multi-network Bulk controller identity uses the shipped runtime reader
        run: |
          node --check tests/test_uce_bulk_runtime_ownership.mjs
          node --test tests/test_uce_bulk_runtime_ownership.mjs
      - name: UCE exact-PG33 stopped LAB installer source, tamper and refusal tests
        run: |
          python -m unittest discover -s tests -p 'test_uce_lab_deploy.py' -v
          python candidates/uce/lab_deploy.py
      - name: UCE PG35 guarded new LAB world switch synthetic safety and property backup
        run: |
          python -m py_compile candidates/uce/lab_world_switch.py
          python -m unittest discover -s tests -p 'test_uce_empty_world_switch.py' -v
      - name: UCE explicit zero-Q4 new LAB world activation via existing cold authority
        run: |
          node --check candidates/transport/unified_new_world_activation.mjs
          node --test tests/test_unified_new_world_activation.mjs
      - name: UCE archived-world Q4 non-mutating census and item-shape preflight
        run: |
          node --check candidates/transport/unified_migration_preflight.mjs
          node --check tests/test_unified_migration_preflight.mjs
          node --test tests/test_unified_migration_preflight.mjs
      - name: UCE one global custody/recovery gate for native and ordinary service
        run: |
          node --check tests/test_uce_unified_tick_gate.mjs
          node --test tests/test_uce_unified_tick_gate.mjs
      - name: UCE PG42 isolated native carrier fixture: world switch, read-only preservation and restart probe
        run: |
          git fetch --quiet --no-tags --depth=1 origin 22637cae8b988b19e6ecadb1280c34f7dbf1c617 91389e6bfbc72e1d88e147c507fd473bfc9aef7e
          node --check tests/pg42_probe.js
          node --test tests/test_uce_pg42_probe_mock.mjs
          python -m py_compile candidates/uce/pg42_world_switch.py candidates/uce/pg42_lab_patch.py
          python -m unittest discover -s tests -p 'test_uce_pg42_carrier_lab.py' -v
      - name: UCE PG41 BDS 1.26.63.1 carrier and Bulk recipe parser correction exact PG40 predecessor
        run: |
          git fetch --quiet --no-tags --depth=1 origin 22637cae8b988b19e6ecadb1280c34f7dbf1c617 91389e6bfbc72e1d88e147c507fd473bfc9aef7e
          python -m py_compile candidates/uce/pg41_lab_patch.py
          python -m unittest discover -s tests -p 'test_uce_pg41_lab_patch.py' -v
      - name: UCE PG40 pinned PG37-only read-only PG39 native carrier forensic census
        run: |
          git fetch --quiet --no-tags --depth=1 origin 22637cae8b988b19e6ecadb1280c34f7dbf1c617 91389e6bfbc72e1d88e147c507fd473bfc9aef7e
          python -m py_compile candidates/uce/pg40_lab_patch.py
          python -m unittest discover -s tests -p 'test_uce_pg40_lab_patch.py' -v
      - name: UCE PG37 bounded sealed Receiver owner census and guarded same-version patch
        run: |
          node --check tests/test_uce_diagnostics_mock.mjs
          node --test tests/test_uce_diagnostics_mock.mjs
          python -m py_compile candidates/uce/pg37_lab_patch.py
          # The PG37 installer is restricted to its original source commit.
          # Run its exact historical synthetic checks in an isolated worktree;
          # never make a newer UCE candidate pretend to be the PG37 patch.
          git fetch --quiet --no-tags --depth=1 origin 22637cae8b988b19e6ecadb1280c34f7dbf1c617 bc8d2bce5bce62cac8e3a03ec3eb99bf113a31eb 6e02f29b168caecff5d379795fcd9b5b714ab0be
          historical="$(mktemp -d)"
          git worktree add --quiet --detach "$historical" 22637cae8b988b19e6ecadb1280c34f7dbf1c617
          (cd "$historical" && python -m unittest discover -s tests -p 'test_uce_pg37_lab_patch.py' -v)
          git worktree remove --force "$historical"
      - name: UCE PG36 exact old-to-new same-version patch source and synthetic refusal
        run: |
          python -m py_compile candidates/uce/pg36_lab_patch.py
          git fetch --quiet --no-tags --depth=1 origin bc8d2bce5bce62cac8e3a03ec3eb99bf113a31eb 6e02f29b168caecff5d379795fcd9b5b714ab0be
          historical="$(mktemp -d)"
          git worktree add --quiet --detach "$historical" bc8d2bce5bce62cac8e3a03ec3eb99bf113a31eb
          (cd "$historical" && python -m unittest discover -s tests -p 'test_uce_pg36_lab_patch.py' -v)
          git worktree remove --force "$historical"
      - name: UCE PG36 fresh sealed new-world first Collector link bootstrap
        run: |
          node --check candidates/transport/unified_link_registry.mjs
          node --test tests/test_unified_link_registry.mjs
          node --check tests/test_uce_new_world_link_bootstrap.mjs
          node --test tests/test_uce_new_world_link_bootstrap.mjs
      - name: UCE new Receiver sealed registration runtime hydration and links
        run: |
          node --check tests/test_uce_receiver_runtime_registration.mjs
          node --test tests/test_uce_receiver_runtime_registration.mjs
      - name: UCE sealed Sorter noncustody configuration gate, legacy link freeze
        run: |
          node --check tests/test_uce_sorter_config_fence.mjs
          node --test tests/test_uce_sorter_config_fence.mjs
      - name: UCE versioned Collector link and sealed Receiver authority, no Q4 mutation
        run: |
          node --check candidates/transport/unified_link_registry.mjs
          node --check tests/test_unified_link_registry.mjs
          node --test tests/test_unified_link_registry.mjs
      - name: UCE unified readonly product status and custody journal alerts
        run: |
          node --check tests/test_uce_diagnostics_mock.mjs
          node --test tests/test_uce_diagnostics_mock.mjs
      - name: Q5 history-first maintenance transition and crash-cutpoint matrix (offline)
        run: |
          node --check candidates/transport/q5_history_first_transition.mjs
          node --check tests/test_q5_history_first_transition.mjs
          node --test tests/test_q5_history_first_transition.mjs
      - name: Q5 whole-world shadow write plans and mock torn-record recovery (offline)
        run: |
          node --check candidates/transport/q5_world_shadow_plan.mjs
          node --check tests/test_q5_world_shadow_plan.mjs
          node --test tests/test_q5_world_shadow_plan.mjs
      - name: Q5 current Q4 source freshness before and after sealed shadow inspection
        run: |
          node --check candidates/transport/q5_shadow_source_freshness.mjs
          node --check tests/test_q5_shadow_source_freshness.mjs
          node --test tests/test_q5_shadow_source_freshness.mjs
      - name: Q5 exact-PG27 native Bedrock mutation owner census (offline)
        run: |
          python -m unittest discover -s tests -p 'test_q5_pg27_native_effect_census.py' -v
          python candidates/transport/q5_pg27_native_effect_census.py
      - name: Q5 exact-PG27 native mutation precommit refusal preview (nondeployable)
        run: |
          python -m unittest discover -s tests -p 'test_q5_native_precommit_preview.py' -v
          python candidates/transport/q5_native_precommit_preview.py
      - name: Offline physical chest-vs-journal reconciliation (no automatic retries)
        run: |
          node --check candidates/transport/physical_reconciliation_core.mjs
          node --test tests/test_transport_physical_reconciliation.mjs
      - name: Enumerate abrupt-crash persistence and refuse insecure ordinary custody
        run: |
          node --check candidates/transport/custody_crash_gate.mjs
          node --test tests/test_transport_custody_crash_gate.mjs
      - name: Classify owner rollback vs mixed physical custody without auto-settlement
        run: |
          node --check candidates/transport/crash_origin_reconciliation.mjs
          node --check tests/test_crash_origin_reconciliation.mjs
          node --test tests/test_crash_origin_reconciliation.mjs
      - name: Audit single-writer adoption across old routes and postrestart journals
        run: |
