  pg08-python312-launcher-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up LAB-host-compatible Python 3.12
        uses: actions/setup-python@v6
        with:
