name: Blueprint compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate declared project structure
        run: python scripts/validate_blueprint.py
      - name: Run blueprint validator self-tests only
        run: python tests/test_validate_blueprint.py -v
      - name: Run HartLogistics LAB updater offline safety tests
        run: python -m unittest discover -s tests -p 'test_hartlogistics_lab_updater.py' -v

      - name: Bundle 1 offline disposable probe contract
        run: python -m unittest discover -s tests -p 'test_bundle1_probe.py' -v
      - name: Bundle 1 temporary JavaScript syntax
        run: node --check tests/bundle1_probe/behavior_pack/scripts/main.js

      - name: Bundle 1 native-transfer mock simulations (offline only)
        run: node tests/bundle1_probe/offline_sim.cjs
