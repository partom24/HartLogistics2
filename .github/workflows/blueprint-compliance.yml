name: Blueprint compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate declared project structure
        run: python scripts/validate_blueprint.py
      - name: Run blueprint validator self-tests only
        run: python tests/test_validate_blueprint.py -v
      - name: Run HartLogistics LAB updater offline safety tests
        run: python -m unittest discover -s tests -p 'test_hartlogistics_lab_updater.py' -v
      - name: Check legacy MR preservation and proposed ordinary network fail-closed invariants
        run: python -m unittest discover -s tests -p 'test_legacy_mr_offline_invariants.py' -v
      - name: Source-execute 1.4.1 native-item recovery fault windows without changing gameplay
        run: |
          node --check tests/test_legacy_mr_recovery_faults.mjs
          node --test tests/test_legacy_mr_recovery_faults.mjs
      - name: Verify offline six-face Transporter graph connectivity proposal
        run: python -m unittest discover -s tests -p 'test_transport_topology_model.py' -v
      - name: Check proposed Transporter region authority fails closed on splits, unloads and competing controllers
        run: python -m unittest discover -s tests -p 'test_transport_authority_model.py' -v
      - name: Exercise offline-only PG18 region repartition and held predecessor fences
        run: |
          node --check candidates/transport/region_repartition_proposal.mjs
          node --test tests/test_transport_repartition_proposal.mjs
      - name: Exercise standalone ordinary Transporter/Bulk pure-JavaScript core
        run: |
          node --check candidates/transport/ordinary_network_core.mjs
          node --test tests/test_transport_bulk_core.mjs
      - name: Offline physical chest-vs-journal reconciliation (no automatic retries)
        run: |
          node --check candidates/transport/physical_reconciliation_core.mjs
          node --test tests/test_transport_physical_reconciliation.mjs
      - name: Enumerate abrupt-crash persistence and refuse insecure ordinary custody
        run: |
          node --check candidates/transport/custody_crash_gate.mjs
          node --test tests/test_transport_custody_crash_gate.mjs
      - name: Classify owner rollback vs mixed physical custody without auto-settlement
        run: |
          node --check candidates/transport/crash_origin_reconciliation.mjs
          node --check tests/test_crash_origin_reconciliation.mjs
          node --test tests/test_crash_origin_reconciliation.mjs
      - name: Audit single-writer adoption across old routes and postrestart journals
        run: |
          node --check candidates/transport/unified_writer_adoption_audit.mjs
          node --check tests/test_unified_writer_adoption_audit.mjs
          node --test tests/test_unified_writer_adoption_audit.mjs
      - name: Verify original cross-lane hazard model rejects phantom custody
        run: |
          node --check candidates/transport/cross_lane_hazard_audit.mjs
          node --test tests/test_transport_cross_lane_hazard_audit.mjs
      - name: Fault-inject standalone ordinary transfer append-only journal on ephemeral runner
        run: |
          node --check candidates/transport/ordinary_journal.node.mjs
          node --test tests/test_transport_journal.node.mjs
      - name: Offline Bundle 2 placed-block, q4 to q5 and menu safety models
        run: python -m unittest discover -s tests -p 'test_bundle2_offline_safety.py' -v
      - name: Verify PG08 menu candidate offline build source gates
        run: python -m unittest discover -s tests -p 'test_pg08_candidate_build.py' -v
      - name: Simulate PG08 LAB 1.5.0 multi-pack install and rollback
        run: python -m unittest discover -s tests -p 'test_pg08_lab_deploy.py' -v
      - name: Exercise actual PG08 menu candidate with Node mocks
        run: |
          node --check candidates/pg08/menu_overlay.js
          node tests/test_pg08_menu_mock.cjs
      - name: Verify PG13 shadow 1.5.2 candidate and no baseline changes
        run: python -m unittest discover -s tests -p 'test_pg13_candidate_build.py' -v
      - name: Exercise PG13 synthetic multi-mod LAB 1.5.1 -> 1.5.2 swap and rollback
        run: python -m unittest discover -s tests -p 'test_pg13_lab_deploy.py' -v
      - name: Run actual isolated PG13 shadow command callbacks in Node VM
        run: |
          node --check candidates/pg13/shadow_overlay.js
          node tests/test_pg13_shadow_mock.cjs
      - name: Compile isolated PG13 candidate and check full JavaScript syntax
        run: |
          python candidates/pg13/prepare_candidate.py
          node --check --input-type=module < build/pg13-lab/behavior_pack/scripts/main.js
      - name: Verify PG14 exact source and 1.5.3 derived build
        run: python -m unittest discover -s tests -p 'test_pg14_candidate_build.py' -v
      - name: Verify PG14 guarded LAB 1.5.2 -> 1.5.3 synthetic rollback
        run: python -m unittest discover -s tests -p 'test_pg14_lab_deploy.py' -v
      - name: Fault-inject actual PG14 single-cobble custody JavaScript
        run: |
          node --check candidates/pg14/custody_overlay.js
          node --test tests/test_pg14_custody_mock.cjs
      - name: Compile isolated PG14 full derived JavaScript
        run: |
          python candidates/pg14/prepare_candidate.py
          node --check --input-type=module < build/pg14-lab/behavior_pack/scripts/main.js
      - name: Verify PG15 exact 1.5.4 derived source and version safety
        run: python -m unittest discover -s tests -p 'test_pg15_candidate_build.py' -v
      - name: Verify PG15 synthetic 1.5.3 -> 1.5.4 LAB and rollback
        run: python -m unittest discover -s tests -p 'test_pg15_lab_deploy.py' -v
      - name: Exercise actual PG15 before/after-move INTENT cutpoints in Node VM
        run: |
          node --check candidates/pg15/interrupted_overlay.js
          node --test tests/test_pg15_cut_mock.cjs
      - name: Compile isolated PG15 complete derived Bedrock JavaScript
        run: |
          python candidates/pg15/prepare_candidate.py
          node --check --input-type=module < build/pg15-lab/behavior_pack/scripts/main.js
      - name: Verify immutable baseline and stripped probes in PG20 derived build
        run: python -m unittest discover -s tests -p 'test_pg20_candidate_build.py' -v
      - name: Compile PG20 clean derived LAB pack and exercise native MR fault recovery
        run: |
          python candidates/pg20/prepare_candidate.py
          node --check --input-type=module < build/pg20-lab/behavior_pack/scripts/main.js
          node --check tests/test_pg20_native_recovery_mock.mjs
          node --test tests/test_pg20_native_recovery_mock.mjs
      - name: Verify immutable baseline and bounded PG23 native compaction source
        run: python -m unittest discover -s tests -p 'test_pg23_candidate_build.py' -v
      - name: Verify original two-write fault and source-execute PG23 compaction recovery
        run: |
          node --check tests/test_pg23_original_compaction_faults.mjs
          node --test tests/test_pg23_original_compaction_faults.mjs
          python candidates/pg23/prepare_candidate.py
          node --check --input-type=module < build/pg23-lab/behavior_pack/scripts/main.js
          node --check tests/test_pg23_native_compaction_mock.mjs
          node --test tests/test_pg23_native_compaction_mock.mjs
      - name: Compile isolated PG08 candidate and check JavaScript syntax
        run: |
          python candidates/pg08/prepare_candidate.py
          node --check --input-type=module < build/pg08-lab/behavior_pack/scripts/main.js


  pg08-python312-launcher-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up LAB-host-compatible Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise real PG08 Plan launcher with Python 3.12 in disposable Git fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Entire checkout and script run are under a disposable GitHub runner,
          # never a real Minecraft server. Plan mode does not inspect LAB.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'pg08-launcher-fixture'
          [void](New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force)
          $workspace = Join-Path $env:LOCALAPPDATA 'HartLogistics2-PG08-LAB'
          & git.exe clone --quiet . $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture clone failed' }
          & git.exe -C $workspace checkout -B main
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture main checkout failed' }
          & git.exe -C $workspace remote set-url origin https://github.com/partom24/HartLogistics2.git
          if ($LASTEXITCODE -ne 0) { throw 'Local fixture origin setup failed' }
          $output = & '.\\candidates\\pg08\\Start-HartLogistics-PG08Lab.ps1' -Mode Plan | Out-String
          if (-not $output.Contains('Using Python 3.12')) { throw 'Launcher did not select existing Python 3.12' }
          if ($output -notmatch 'PG08 SOURCE PASS') { throw 'Source-only Plan failed' }
          if ($output -notmatch 'No LAB/PROD files accessed') { throw 'Missing no-server-access evidence' }
          Write-Host $output
          Write-Host 'PG08 Python 3.12 launcher PLAN PASS on Windows ephemeral runner'

