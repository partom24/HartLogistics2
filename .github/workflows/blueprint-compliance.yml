name: Blueprint compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate declared project structure
        run: python scripts/validate_blueprint.py
      - name: Run blueprint validator self-tests only
        run: python tests/test_validate_blueprint.py -v
      - name: Run HartLogistics LAB updater offline safety tests
        run: python -m unittest discover -s tests -p 'test_hartlogistics_lab_updater.py' -v

      - name: Bundle 1 offline disposable probe contract
        run: python -m unittest discover -s tests -p 'test_bundle1_probe.py' -v
      - name: Bundle 1 temporary JavaScript syntax
        run: node --check tests/bundle1_probe/behavior_pack/scripts/main.js

      - name: Bundle 1 native-transfer mock simulations (offline only)
        run: node tests/bundle1_probe/offline_sim.cjs

  bundle1-powershell-offline-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Parse Windows PowerShell updater and synthetic tests
        shell: powershell
        run: |
          $paths = @('tests/bundle1_probe/Update-HartLogistics-Bundle1Lab.ps1', 'tests/bundle1_probe/Test-PowerShellUpdater.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Windows PowerShell 5.1 synthetic installer checks
        shell: powershell
        run: |
          .\tests\bundle1_probe\Test-PowerShellUpdater.ps1
      - name: PowerShell 7 synthetic installer checks
        shell: pwsh
        run: |
          .\tests\bundle1_probe\Test-PowerShellUpdater.ps1
