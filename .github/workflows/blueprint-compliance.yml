  bundle2-readonly-preflight-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python for synthetic PG08 deployment checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify PG08 LAB replacement safety on Windows fixture
        run: python -m unittest discover -s tests -p 'test_pg08_lab_deploy.py' -v
      - name: Verify PG13 guarded replacement on Windows synthetic fixture
        run: python -m unittest discover -s tests -p 'test_pg13_lab_deploy.py' -v
      - name: Verify PG15 guarded replacement on Windows synthetic fixture
        run: python -m unittest discover -s tests -p 'test_pg15_lab_deploy.py' -v
      - name: Verify PG20 guarded upgrade and rollback on Windows synthetic fixture
        run: python -m unittest discover -s tests -p 'test_pg20_lab_deploy.py' -v
      - name: Verify PG23 guarded upgrade and rollback on Windows synthetic fixture
        run: python -m unittest discover -s tests -p 'test_pg23_lab_deploy.py' -v
      - name: PG20 PowerShell launcher parses and refuses unsafe modes
        shell: powershell
        run: |
          $launcher = '.\\candidates\\pg20\\Start-HartLogistics-PG20Lab.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $launcher).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ('PG20 PowerShell syntax errors: ' + ($errors | Out-String)) }
          foreach ($argsSet in @(
            @('-Mode','Install'),
            @('-Mode','Rollback','-Apply'),
            @('-Mode','CheckLab','-Apply'),
            @('-Mode','Plan','-Apply')
          )) {
            $rejected = $false
            try { & $launcher @argsSet | Out-Null } catch { $rejected = $true }
            if (-not $rejected) { throw ('PG20 did not refuse: ' + ($argsSet -join ' ')) }
          }
          Write-Host 'PG20 launcher syntax and fail-closed CLI PASS'
